<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BONDORA SMP</title>

  <!-- Minecraft Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Press Start 2P', cursive;
    }

    body {
      background: #6aa84f;
      color: white;
      text-align: center;
    }

    marquee {
      background: #3a5f0b;
      padding: 8px;
      font-size: 10px;
    }

    header {
      background: #3a5f0b;
      padding: 25px;
      border-bottom: 6px solid #2b4a08;
    }

    header img {
      width: 90px;
      margin-bottom: 10px;
    }

    .join-card {
      background: #7fc242;
      border: 6px solid #3a5f0b;
      width: 90%;
      max-width: 520px;
      margin: 40px auto;
      padding: 30px;
    }

    .join-card h2 {
      font-size: 14px;
      margin-bottom: 20px;
    }

    .info {
      background: #c6c6c6;
      color: black;
      border: 4px solid #555;
      padding: 15px;
      margin: 15px 0;
      font-size: 10px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }

    .mc-btn {
      width: 100%;
      padding: 14px;
      background: #7fc242;
      border: 4px solid #3a5f0b;
      color: white;
      font-size: 10px;
      cursor: pointer;
      box-shadow: inset -4px -4px #558b2f;
      transition: 0.2s;
    }

    .mc-btn:hover {
      background: #8fd14f;
      transform: scale(1.05);
    }

    .discord-btn {
      background: #5865F2;
      border: none;
      padding: 14px;
      font-size: 12px;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      width: 100%;
    }

    .copy-msg {
      font-size: 9px;
      margin-top: 12px;
      color: #003300;
      display: none;
    }

    footer {
      font-size: 9px;
      color: #eaffd0;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<marquee>LATEST BEDROCK VERSION ONLY • NO CRACKED • JOIN DISCORD FOR RULES</marquee>

<header>
  <h1>BONDORA SMP</h1>
</header>

<div class="join-card">
  <h2>SERVER INFO</h2>

  <div class="info">IP: bondora.aternos.me</div>
  <div class="info">PORT: Opening on March. Stay Tuned</div>
  <div class="info">EDITION: Bedrock Only</div>

  <div class="btn-group">
    <button class="mc-btn" onclick="copyIP()">COPY IP</button>
    <button class="mc-btn" onclick="copyPort()">COPY PORT</button>
    <button class="mc-btn" onclick="addToMinecraft()">ADD TO MINECRAFT</button>

    <a href="https://discord.gg/YOUR_INVITE_CODE" target="_blank">
      <button class="discord-btn">JOIN DISCORD</button>
    </a>
  </div>

  <p class="copy-msg" id="msg">✔ Copied to clipboard!</p>
</div>

<footer>
  Unity & Adventure SMP • Owner: Trideep
</footer>

<marquee>FOLLOW RULES • NO CHEATS • RESPECT PLAYERS • HAVE FUN</marquee>

<script>
  const msg = document.getElementById("msg");

  function showMsg() {
    msg.style.display = "block";
    setTimeout(() => msg.style.display = "none", 1500);
  }

  function copyIP() {
    navigator.clipboard.writeText("bondora.aternos.me");
    showMsg();
  }

  function copyPort() {
    navigator.clipboard.writeText("38870");
    showMsg();
  }

  function addToMinecraft() {
    window.location.href =
      "minecraft://?addExternalServer=Bondora SMP|bondora.aternos.me:XXXXX";
  }
</script>

</body>
</html>
