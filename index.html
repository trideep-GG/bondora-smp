<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player Registration</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.form-box {
    background: #020617;
    padding: 25px;
    border-radius: 12px;
    width: 320px;
}
.progress {
    font-size: 12px;
    margin-bottom: 10px;
    color: #93c5fd;
}
label { margin-top: 10px; display: block; }
input, select, button {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 6px;
    border: none;
}
input, select { background: #1e293b; color: white; }
button {
    background: #3b82f6;
    color: white;
    margin-top: 15px;
    cursor: pointer;
}
button:disabled {
    background: #475569;
    cursor: not-allowed;
}
</style>
</head>

<body>

<form class="form-box" onsubmit="sendToDiscord(event)">
    <div class="progress">Step 1 of 4 • Registration</div>

    <h2>Player Registration</h2>

    <label>Real Name</label>
    <input type="text" id="realname" required>

    <label>Game Name</label>
    <input type="text" id="gamename" required>

    <label>Age</label>
    <select id="age" required>
        <option value="">Select age</option>
        <script>
            for (let i = 1; i <= 100; i++) {
                document.write(`<option value="${i}">${i}</option>`);
            }
        </script>
    </select>

    <label>Discord Profile Link</label>
    <input type="url" id="discord" required>

    <button id="submitBtn" type="submit">Submit</button>
</form>

<script>
function sendToDiscord(event) {
    event.preventDefault();

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "Submitting...";

    // SAVE PLAYER NAME
    localStorage.setItem("playerName", gamename.value);

    const webhookURL = "PASTE_YOUR_WEBHOOK_HERE";

    const message = {
        content:
        "**🎮 New Player Registration**\n" +
        "**Real Name:** " + realname.value +
        "\n**Game Name:** " + gamename.value +
        "\n**Age:** " + age.value +
        "\n**Discord:** " + discord.value
    };

    fetch(webhookURL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(message)
    }).then(() => {
        window.location.href = "success.html";
    }).catch(() => {
        alert("Submission failed");
        btn.disabled = false;
        btn.innerText = "Submit";
    });
}
</script>

</body>
</html>
