<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration Complete</title>

<style>
body {
    background: #020617;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.box {
    background: #0f172a;
    padding: 30px;
    border-radius: 14px;
    width: 320px;
    text-align: center;
}
.progress {
    font-size: 12px;
    color: #93c5fd;
    margin-bottom: 10px;
}
button {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="box">
    <div class="progress">Step 2 of 4 • Confirm</div>

    <h2>✅ Registration Successful</h2>
    <p>Welcome, <b id="player"></b>!</p>

    <button onclick="goNext()">Continue</button>
</div>

<script>
document.getElementById("player").innerText =
    localStorage.getItem("playerName") || "Player";

function goNext() {
    window.location.href = "interface.html";
}
</script>

</body>
</html>
